<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Git Handler Hook</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="title-group">
        <h1>Git Handler Hook</h1>
        <span id="status-badge" class="badge">checking…</span>
      </div>
      <button id="uninstall-btn">Uninstall</button>
    </header>

    <nav>
      <button data-view="history" class="active">History</button>
      <button data-view="settings">Settings</button>
    </nav>

    <main>
      <section id="view-history">
        <table id="history-table">
          <thead>
            <tr>
              <th>Time</th>
              <th>Repo</th>
              <th>Branch</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="history-body"></tbody>
        </table>
        <p id="history-empty" class="muted" hidden>No commits recorded yet — make a commit in any repo to see it here.</p>
      </section>

      <section id="view-settings" hidden>
        <div id="settings-form"></div>
        <div class="settings-actions">
          <button id="settings-save">Save changes</button>
          <span id="settings-saved" class="muted" hidden>Saved</span>
        </div>
      </section>
    </main>

    <div id="detail-modal" class="modal" hidden>
      <div class="modal-content">
        <div class="modal-header">
          <h2>Commit detail</h2>
          <button id="detail-close">Close</button>
        </div>
        <pre id="detail-body"></pre>
      </div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
